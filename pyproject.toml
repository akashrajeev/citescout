[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citescout"
version = "0.1.0"
description = "A research agent for developers that answers with typed citations and flags when sources disagree. Powered by SerpApi."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "serpapi>=1.1.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
citescout = "citescout.cli:main"

[tool.setuptools.packages.find]
include = ["citescout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
